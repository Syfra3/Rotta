# Rotta — Quality Gates
# This ordered list is the complete generic Phase 4 review plan.
format: rotta.quality-gates/v2
gate_order:
  - build
  - tests
  - changed_file_scope
  - static_analysis
  - dependency_checks
  - security_checks
discovery:
  supported_inputs:
    - declared_project_metadata
    - task_runner_targets
    - repository_tool_configuration
  rules:
    - declared_convention_only
    - trusted_snapshot_comparison
gates:
  - id: build
    enabled: true
  - id: tests
    enabled: true
  - id: changed_file_scope
    enabled: true
  - id: static_analysis
    enabled: true
  - id: dependency_checks
    enabled: true
  - id: security_checks
    enabled: true
