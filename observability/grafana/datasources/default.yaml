apiVersion: 1
datasources:
  - name: Local Prometheus
    type: prometheus
    uid: local-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Local Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
  - name: Local Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
